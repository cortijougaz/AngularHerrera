<h1>DragonBall Page</h1>
<hr/>

<section class="row">
  <div class="col-12 col-sm-6">
    <drabonball-character-add
    (newCharacter)="dragonballService.addCharacter($event)"></drabonball-character-add>
  </div>
  <div class="col-12 col-sm-6">
    <dragonball-character-list
      listName="Listado de personajes"
      [characters]="dragonballService.characters()"></dragonball-character-list>
  </div>
</section>
